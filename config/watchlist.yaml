# =============================================================
# ゴールデンクロス通知 設定ファイル
# =============================================================
# 銘柄はここに自由に追加・削除できます。
# yfinance のティッカー表記を使います。
#   日本株: 証券コード + ".T"   （例: 7203.T = トヨタ自動車）
#   米国株: ティッカーそのまま    （例: NVDA   = NVIDIA）

# ---- ゴールデン/デッドクロスの判定に使う移動平均（日数）----
# short が long を下から上に抜ける = ゴールデンクロス（買いシグナル）
# short が long を上から下に抜ける = デッドクロス  （売りシグナル）
sma:
  short: 25      # 短期移動平均（例: 25日）
  long: 75       # 長期移動平均（例: 75日）

# ---- 監視銘柄 ----
stocks:
  jp:
    - { symbol: "7203.T", name: "トヨタ自動車" }
    - { symbol: "6758.T", name: "ソニーグループ" }
    - { symbol: "8035.T", name: "東京エレクトロン" }
    - { symbol: "6857.T", name: "アドバンテスト" }
    - { symbol: "9984.T", name: "ソフトバンクグループ" }
  us:
    - { symbol: "NVDA", name: "NVIDIA" }
    - { symbol: "AMD",  name: "AMD" }
    - { symbol: "AAPL", name: "Apple" }
    - { symbol: "MSFT", name: "Microsoft" }

# ---- 市場環境の指標（地合い情報として通知に添付）----
market_indicators:
  - { symbol: "^N225", name: "日経平均" }
  - { symbol: "^GSPC", name: "S&P500" }
  - { symbol: "^SOX",  name: "SOX指数(半導体)" }
  - { symbol: "^VIX",  name: "VIX(恐怖指数)" }
  - { symbol: "JPY=X", name: "ドル円" }
