# =============================================================
# ゴールデンクロス通知 設定ファイル
# =============================================================
# 銘柄はここに自由に追加・削除できます。
# yfinance のティッカー表記を使います。
#   日本株: 証券コード + ".T"   （例: 7203.T = トヨタ自動車）
#   米国株: ティッカーそのまま    （例: NVDA   = NVIDIA）
# theme は通知に [半導体] のように表示されるタグです（任意）。

# ---- ゴールデン/デッドクロスの判定に使う移動平均（日数）----
# short が long を下から上に抜ける = ゴールデンクロス（買いシグナル）
# short が long を上から下に抜ける = デッドクロス  （売りシグナル）
sma:
  short: 25      # 短期移動平均（例: 25日）
  long: 75       # 長期移動平均（例: 75日）

# ---- 監視銘柄 ----
stocks:
  # ===================== 日本株 =====================
  jp:
    # --- 主要・値がさ ---
    - { symbol: "7203.T", name: "トヨタ自動車",         theme: "主力" }
    - { symbol: "6758.T", name: "ソニーグループ",        theme: "主力" }
    - { symbol: "9984.T", name: "ソフトバンクグループ",   theme: "主力" }
