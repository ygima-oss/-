name: X Post Notify

on:
  schedule:
    # 15 分おきにチェック。GitHub Actions の cron は混雑時に遅延する
    # ことがあるため、厳密なリアルタイムではない点に注意。
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "LINE 送信せず本文を確認する"
        type: boolean
        default: false
      notify_first:
        description: "初回でも新着を通知する（基準記録をスキップ）"
        type: boolean
        default: false

# state/seen.json をコミットして次回に引き継ぐため書き込み権限が必要。
permissions:
  contents: write

# 同時実行で state のコミットが競合しないように直列化する。
concurrency:
  group: x-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run X notifier
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          X_RSS_URL: ${{ secrets.X_RSS_URL }}
          X_ACCOUNT: ${{ vars.X_ACCOUNT || 'fumino_official' }}
        run: |
          python -m xwatch.main \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.notify_first) && '--notify-first' || '' }}

      - name: Commit updated state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xwatch/state/seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(xwatch): update seen state [skip ci]"
            git push
          else
            echo "state に変更なし。"
          fi
